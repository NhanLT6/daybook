<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <style>
    .track { stroke: #d2e3d8 }
    .arc { stroke: #4a8c6a }
    .check { stroke: #3b7556 }
    @media (prefers-color-scheme: dark) {
      .track { stroke: #2c4237 }
      .arc, .check { stroke: #7fc29c }
    }
  </style>
  <!-- Day ring filling up (logged hours) with a check (work done) -->
  <circle class="track" cx="16" cy="16" r="12.5" stroke-width="4" />
  <circle class="arc" cx="16" cy="16" r="12.5" stroke-width="4" stroke-dasharray="58.9 78.5" transform="rotate(-90 16 16)" />
  <path class="check" d="M10.5 16.5 14.5 20.5 21.5 12" stroke-width="3.2" />
</svg>
